networks:
  rl-net:
    driver: bridge

volumes:
  rl-postgres-data:
  rl-grafana-data:

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rluser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rlpass}
      POSTGRES_DB: ${POSTGRES_DB:-ratelimiter}
    ports:
      - "5432:5432"
    volumes:
      - rl-postgres-data:/var/lib/postgresql/data
    networks:
      - rl-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rluser}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - rl-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - rl-net

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
    volumes:
      - rl-grafana-data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - rl-net
    depends_on:
      - prometheus

  core:
    build:
      context: ./core
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      REDIS_ADDR: ${REDIS_ADDR:-redis:6379}
      POSTGRES_DSN: ${POSTGRES_DSN:-postgres://rluser:rlpass@postgres:5432/ratelimiter?sslmode=disable}
      CACHE_REFRESH_INTERVAL: ${CACHE_REFRESH_INTERVAL:-30s}
    networks:
      - rl-net
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://rluser:rlpass@postgres:5432/ratelimiter}
    networks:
      - rl-net
    depends_on:
      postgres:
        condition: service_healthy
